services:
  ultra-wiki-mcp:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      WIKI_URL: ${WIKI_URL:-https://wiki.grupoultralinknet.com.br}
      WIKI_API_TOKEN: ${WIKI_API_TOKEN:?WIKI_API_TOKEN deve ser definido}
      WIKI_LOCALE: ${WIKI_LOCALE:-pt-br}
      WIKI_TIMEOUT_MS: ${WIKI_TIMEOUT_MS:-10000}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-20}
      MCP_AUTH_MODE: oauth
      MCP_BASE_URL: ${MCP_BASE_URL:?MCP_BASE_URL deve ser definido}
      OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:?OAUTH_ISSUER_URL deve ser definido}
      OAUTH_JWKS_URL: ${OAUTH_JWKS_URL:?OAUTH_JWKS_URL deve ser definido}
      OAUTH_RESOURCE_URL: ${OAUTH_RESOURCE_URL:?OAUTH_RESOURCE_URL deve ser definido}
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:-}
      OAUTH_AUTHORIZATION_SCOPES: ${OAUTH_AUTHORIZATION_SCOPES:?OAUTH_AUTHORIZATION_SCOPES deve ser definido}
      OAUTH_REQUIRED_SCOPES: ${OAUTH_REQUIRED_SCOPES:-wiki.read}
      OAUTH_ALLOWED_ALGORITHMS: ${OAUTH_ALLOWED_ALGORITHMS:-RS256}
      OAUTH_CLOCK_TOLERANCE_SECONDS: ${OAUTH_CLOCK_TOLERANCE_SECONDS:-5}
      OAUTH_RESOURCE_DOCUMENTATION_URL: ${OAUTH_RESOURCE_DOCUMENTATION_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_PAGE_CONTENT_BYTES: ${MAX_PAGE_CONTENT_BYTES:-2000000}
    ports:
      - "${PORT:-3001}:3001"
